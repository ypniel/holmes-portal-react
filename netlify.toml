# TEST BRANCH ONLY - do not merge into main.
# Experiment 2: use the esbuild bundler for ALL functions (currently only
# "upload" does), instead of relying on Netlify's default bundler, which may
# have changed with the new build tooling. No Node pin (Experiment 1 showed
# pinning Node does not fix it).
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/hubspot"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[functions]
  node_bundler = "esbuild"
  included_files = ["netlify/functions/**"]

[functions."upload"]
  node_bundler = "esbuild"
